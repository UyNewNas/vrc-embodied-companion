name: PlayerObject SDK surface

on:
  pull_request:
    paths:
      - 'World/Assets/Editor/CompanionMinimalWorldBootstrap.cs'
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/CompanionPlayerLifecycle.cs'
      - '.github/workflows/playerobject-sdk-surface.yml'
  push:
    branches:
      - master
    paths:
      - 'World/Assets/Editor/CompanionMinimalWorldBootstrap.cs'
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/CompanionPlayerLifecycle.cs'
      - '.github/workflows/playerobject-sdk-surface.yml'

jobs:
  validate-resolved-sdk-surface:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve committed VRChat SDK graph
        shell: pwsh
        run: |
          dotnet tool install --tool-path .vpm-tools VRChat.VPM.CLI --version 0.1.28
          & .\.vpm-tools\vpm.exe install templates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.vpm-tools\vpm.exe resolve project World
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect PlayerObject component metadata
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'PlayerObjectSurfaceProbe'
          dotnet new console --framework net8.0 --output $probe --force | Out-Null
          @'
          using System.Reflection.Metadata;
          using System.Reflection.PortableExecutable;

          string[] required =
          {
              "VRC.SDK3.Components.VRCPlayerObject",
              "VRC.SDK3.Components.VRCEnablePersistence",
          };

          Dictionary<string, string?> locations = required.ToDictionary(name => name, _ => null);
          int managedAssemblyCount = 0;

          foreach (string root in args)
          {
              foreach (string path in Directory.EnumerateFiles(root, "*.dll", SearchOption.AllDirectories))
              {
                  try
                  {
                      using FileStream stream = File.OpenRead(path);
                      using PEReader pe = new(stream);
                      if (!pe.HasMetadata)
                      {
                          continue;
                      }

                      MetadataReader reader = pe.GetMetadataReader();
                      managedAssemblyCount++;
                      foreach (TypeDefinitionHandle handle in reader.TypeDefinitions)
                      {
                          TypeDefinition type = reader.GetTypeDefinition(handle);
                          string ns = reader.GetString(type.Namespace);
                          string name = reader.GetString(type.Name);
                          string fullName = string.IsNullOrEmpty(ns) ? name : ns + "." + name;
                          if (locations.ContainsKey(fullName))
                          {
                              locations[fullName] = path;
                          }
                      }
                  }
                  catch (BadImageFormatException)
                  {
                      // Native/non-managed DLL; irrelevant to the C# component API surface.
                  }
              }
          }

          Console.WriteLine($"Managed assemblies inspected: {managedAssemblyCount}");
          bool ok = true;
          foreach (string name in required)
          {
              string? location = locations[name];
              Console.WriteLine($"{name}: {(location ?? "MISSING")}");
              ok &= location is not null;
          }

          if (!ok)
          {
              Console.Error.WriteLine("Resolved SDK 3.10.5 no longer exposes the PlayerObject component surface assumed by the minimal world integration.");
              return 1;
          }

          Console.WriteLine("Resolved PlayerObject SDK surface OK");
          return 0;
          '@ | Set-Content -Path (Join-Path $probe 'Program.cs') -Encoding utf8

          dotnet run --project $probe --configuration Release -- `
            'World/Packages/com.vrchat.worlds' `
            'World/Packages/com.vrchat.base'
          if ($LASTEXITCODE -ne 0) {
            throw 'Resolved PlayerObject SDK surface audit failed'
          }
