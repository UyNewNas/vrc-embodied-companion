name: Unity 2022.3.22f1 smoke (self-hosted)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full 40-character commit SHA to test; keep the workflow itself on trusted master'
        required: true
        type: string
      unity_path:
        description: 'Activated Unity 2022.3.22f1 editor executable on the self-hosted Windows runner'
        required: false
        default: 'C:\Program Files\Unity\Hub\Editor\2022.3.22f1\Editor\Unity.exe'
        type: string

permissions:
  contents: read

concurrency:
  group: unity-smoke-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  unity-smoke:
    # Deliberately not a GitHub-hosted runner. The runner must have an activated
    # Unity license and the custom unity-2022.3.22f1 label before this job is dispatched.
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, windows, x64, unity-2022.3.22f1]
    timeout-minutes: 45

    steps:
      - name: Validate dispatch target SHA
        id: dispatch-input
        shell: pwsh
        env:
          UNITY_SMOKE_INPUT_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          $requested = $env:UNITY_SMOKE_INPUT_TARGET_SHA.Trim()
          if ($requested -notmatch '^[0-9a-fA-F]{40}$') {
            throw "target_sha must be a full 40-character commit SHA, got '$requested'."
          }

          $requested = $requested.ToLowerInvariant()
          "sha=$requested" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "UNITY_SMOKE_REQUESTED_SHA=$requested" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.dispatch-input.outputs.sha }}

      - name: Verify immutable target checkout
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -ne $env:UNITY_SMOKE_REQUESTED_SHA) {
            throw "Checked out SHA '$head' does not match requested target_sha '$env:UNITY_SMOKE_REQUESTED_SHA'."
          }

          Write-Host "Immutable target SHA: $head"
          "UNITY_SMOKE_TARGET_SHA=$head" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Initialize Unity smoke evidence directory
        shell: pwsh
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'unity-smoke-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          "UNITY_SMOKE_EVIDENCE_DIR=$evidenceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run checked-in host preflight
        shell: pwsh
        env:
          UNITY_SMOKE_INPUT_UNITY_PATH: ${{ inputs.unity_path }}
        run: |
          $unity = $env:UNITY_SMOKE_INPUT_UNITY_PATH
          if ([string]::IsNullOrWhiteSpace($unity)) {
            $unity = 'C:\Program Files\Unity\Hub\Editor\2022.3.22f1\Editor\Unity.exe'
          }

          $preflight = Join-Path $env:UNITY_SMOKE_EVIDENCE_DIR 'host-preflight.json'
          & .\World\Tools\Test-UnitySmokeHost.ps1 `
            -UnityPath $unity `
            -OutputPath $preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $report = Get-Content $preflight -Raw | ConvertFrom-Json
          if (-not $report.windows) { throw 'Host preflight did not certify Windows.' }
          if ($report.os_architecture -ne 'X64') { throw "Host preflight architecture mismatch: $($report.os_architecture)" }
          if ($report.expected_unity_version -ne '2022.3.22f1') { throw "Host preflight expected Unity version mismatch: $($report.expected_unity_version)" }
          if (-not $report.world_contract_valid) { throw 'Host preflight did not certify the World smoke contract.' }
          if ($report.unity_license_verified -ne $false) { throw 'Host preflight must not claim Unity license verification.' }

          Write-Host "Unity editor: $($report.unity_path)"
          Write-Host "Unity version: $($report.unity_reported_version)"
          "UNITY_EDITOR=$($report.unity_path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UNITY_REPORTED_VERSION=$($report.unity_reported_version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install supported VPM CLI baseline
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'vpm-tools'
          dotnet tool install --tool-path $toolDir VRChat.VPM.CLI --version 0.1.28
          $vpm = Join-Path $toolDir 'vpm.exe'
          & $vpm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VPM_EXE=$vpm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve committed VRChat SDK graph
        shell: pwsh
        run: |
          & $env:VPM_EXE install templates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:VPM_EXE check project World
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:VPM_EXE resolve project World
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $base = Get-Content 'World/Packages/com.vrchat.base/package.json' -Raw | ConvertFrom-Json
          $worlds = Get-Content 'World/Packages/com.vrchat.worlds/package.json' -Raw | ConvertFrom-Json
          if ($base.version -ne '3.10.5') { throw "Expected com.vrchat.base 3.10.5, got $($base.version)" }
          if ($worlds.version -ne '3.10.5') { throw "Expected com.vrchat.worlds 3.10.5, got $($worlds.version)" }

          $status = @(git status --porcelain=v1 --untracked-files=all -- World)
          if ($status.Count -gt 0) {
            $status | ForEach-Object { Write-Host $_ }
            git diff -- World
            throw 'VPM resolve changed or exposed untracked World source files.'
          }

      - name: Record immutable execution context
        shell: pwsh
        run: |
          $base = Get-Content 'World/Packages/com.vrchat.base/package.json' -Raw | ConvertFrom-Json
          $worlds = Get-Content 'World/Packages/com.vrchat.worlds/package.json' -Raw | ConvertFrom-Json
          @{
            schema = 'unity-smoke-runner-context.v0.2'
            repository = $env:GITHUB_REPOSITORY
            workflow_ref = $env:GITHUB_REF
            workflow_sha = $env:GITHUB_SHA
            tested_sha = $env:UNITY_SMOKE_TARGET_SHA
            run_id = $env:GITHUB_RUN_ID
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            unity_path = $env:UNITY_EDITOR
            unity_reported_version = $env:UNITY_REPORTED_VERSION
            vrchat_base_version = $base.version
            vrchat_worlds_version = $worlds.version
            recorded_at_utc = [DateTimeOffset]::UtcNow.ToString('o')
          } | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $env:UNITY_SMOKE_EVIDENCE_DIR 'runner-context.json') -Encoding utf8

      - name: Execute real Unity import / compile / save-reopen smoke
        shell: pwsh
        run: |
          $log = Join-Path $env:UNITY_SMOKE_EVIDENCE_DIR 'unity-smoke.log'
          $summary = Join-Path $env:UNITY_SMOKE_EVIDENCE_DIR 'unity-smoke-summary.json'
          & .\World\Tools\Invoke-UnitySmoke.ps1 `
            -UnityPath $env:UNITY_EDITOR `
            -LogPath $log `
            -SummaryPath $summary

      - name: Upload Unity smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-2022.3.22f1-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}\unity-smoke-evidence
          if-no-files-found: warn
          retention-days: 14
