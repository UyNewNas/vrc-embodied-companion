name: Unity smoke workflow contract

on:
  pull_request:
    paths:
      - '.github/workflows/unity-smoke-self-hosted.yml'
      - '.github/workflows/unity-smoke-contract.yml'
      - 'World/Tools/Invoke-UnitySmoke.ps1'
      - 'World/Tools/Test-UnitySmokeHost.ps1'
      - 'World/ProjectSettings/ProjectVersion.txt'
      - 'docs/UNITY_SMOKE_EXECUTION.md'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/unity-smoke-self-hosted.yml'
      - '.github/workflows/unity-smoke-contract.yml'
      - 'World/Tools/Invoke-UnitySmoke.ps1'
      - 'World/Tools/Test-UnitySmokeHost.ps1'
      - 'World/ProjectSettings/ProjectVersion.txt'
      - 'docs/UNITY_SMOKE_EXECUTION.md'

permissions:
  contents: read

jobs:
  validate-manual-runner-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate real-Unity execution workflow is explicit and fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/unity-smoke-self-hosted.yml').read_text(encoding='utf-8')
          project_version = Path('World/ProjectSettings/ProjectVersion.txt').read_text(encoding='utf-8')
          smoke = Path('World/Tools/Invoke-UnitySmoke.ps1').read_text(encoding='utf-8')
          host_preflight = Path('World/Tools/Test-UnitySmokeHost.ps1').read_text(encoding='utf-8')
          docs = Path('docs/UNITY_SMOKE_EXECUTION.md').read_text(encoding='utf-8')
          expression_open = '$' + '{{'

          assert 'm_EditorVersion: 2022.3.22f1' in project_version
          assert "'2022.3.22f1'" in smoke

          required = [
              'workflow_dispatch:',
              'target_sha:',
              "description: 'Full 40-character commit SHA to test; keep the workflow itself on trusted master'",
              "if: github.ref == 'refs/heads/master'",
              'Validate dispatch target SHA',
              'UNITY_SMOKE_INPUT_TARGET_SHA: ' + expression_open + ' inputs.target_sha }}',
              '$requested = $env:UNITY_SMOKE_INPUT_TARGET_SHA.Trim()',
              "^[0-9a-fA-F]{40}$",
              'UNITY_SMOKE_REQUESTED_SHA',
              'ref: ' + expression_open + ' steps.dispatch-input.outputs.sha }}',
              'Verify immutable target checkout',
              'UNITY_SMOKE_TARGET_SHA',
              'Initialize Unity smoke evidence directory',
              "Join-Path $env:RUNNER_TEMP 'unity-smoke-evidence'",
              'Run checked-in host preflight',
              'UNITY_SMOKE_INPUT_UNITY_PATH: ' + expression_open + ' inputs.unity_path }}',
              '$unity = $env:UNITY_SMOKE_INPUT_UNITY_PATH',
              'Test-UnitySmokeHost.ps1',
              "Join-Path $env:UNITY_SMOKE_EVIDENCE_DIR 'host-preflight.json'",
              '-OutputPath $preflight',
              'Get-Content $preflight -Raw | ConvertFrom-Json',
              '$report.os_architecture',
              '$report.expected_unity_version',
              '$report.world_contract_valid',
              '$report.unity_license_verified',
              'UNITY_EDITOR=$($report.unity_path)',
              'UNITY_REPORTED_VERSION=$($report.unity_reported_version)',
              "schema = 'unity-smoke-runner-context.v0.2'",
              'repository = $env:GITHUB_REPOSITORY',
              'workflow_ref = $env:GITHUB_REF',
              'workflow_sha = $env:GITHUB_SHA',
              'tested_sha = $env:UNITY_SMOKE_TARGET_SHA',
              'run_id = $env:GITHUB_RUN_ID',
              'runner_name = $env:RUNNER_NAME',
              'runner_os = $env:RUNNER_OS',
              'runner_arch = $env:RUNNER_ARCH',
              'runs-on: [self-hosted, windows, x64, unity-2022.3.22f1]',
              "VRChat.VPM.CLI --version 0.1.28",
              'resolve project World',
              "Expected com.vrchat.base 3.10.5",
              "Expected com.vrchat.worlds 3.10.5",
              'Invoke-UnitySmoke.ps1',
              'runner-context.json',
              'unity-smoke-summary.json',
              'actions/upload-artifact@v4',
              'if: always()',
          ]
          for token in required:
              assert token in workflow, token

          forbidden = [
              'runs-on: windows-latest',
              'runs-on: windows-2022',
              'push:\n',
              'pull_request:\n',
              '-ValidateOnly',
              'ref: ' + expression_open + ' inputs.target_sha }}',
          ]
          for token in forbidden:
              assert token not in workflow, token

          # GitHub evaluates expressions before writing an inline shell script. Keep
          # dispatch/context values out of every `run: |` block and pass them through
          # environment/default runner variables instead.
          for block in workflow.split('        run: |')[1:]:
              script = block.split('\n      - ', 1)[0]
              assert expression_open not in script, script

          lowered = workflow.lower()
          for secretish in ('unity_serial', 'unity_username', 'unity_password', '-serial '):
              assert secretish not in lowered, secretish

          preflight_required = [
              "$expectedUnityVersion = '2022.3.22f1'",
              "$env:OS -ne 'Windows_NT'",
              'OSArchitecture',
              '& $UnityPath -version',
              "2022\\.3\\.22f1",
              'Invoke-UnitySmoke.ps1',
              '-ValidateOnly',
              'unity_license_verified = $false',
              "required_runner_labels = @('self-hosted', 'windows', 'x64', 'unity-2022.3.22f1')",
          ]
          for token in preflight_required:
              assert token in host_preflight, token

          preflight_lowered = host_preflight.lower()
          for secretish in ('registration_token', 'unity_serial', 'unity_username', 'unity_password', '-serial '):
              assert secretish not in preflight_lowered, secretish

          assert 'temporary runner' in docs.lower()
          assert 'unity_license_verified=false' in docs
          assert 'do not paste it into an issue, commit, workflow, or log' in docs.lower()
          assert 'full 40-character commit sha' in docs.lower()
          assert 'run workflow from `master`' in docs.lower()
          assert 'tested_sha' in docs
          assert 'host-preflight.json' in docs
          assert 'reruns the checked-in host preflight' in docs.lower()

          print('Self-hosted Unity smoke workflow/host preflight contract OK')
          PY
