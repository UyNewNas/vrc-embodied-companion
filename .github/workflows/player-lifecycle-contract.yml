name: Player lifecycle contract

on:
  pull_request:
    paths:
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/CompanionPlayerLifecycle.cs'
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/CompanionPlayerLookup.cs'
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/README.md'
      - 'World/Assets/Editor/CompanionMinimalWorldBootstrap.cs'
      - '.github/workflows/player-lifecycle-contract.yml'
  push:
    branches:
      - master
    paths:
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/CompanionPlayerLifecycle.cs'
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/CompanionPlayerLookup.cs'
      - 'World/Assets/Editor/CompanionMinimalWorldBootstrap.cs'
      - '.github/workflows/player-lifecycle-contract.yml'

jobs:
  validate-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate PlayerObject lifecycle invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('Packages/com.uynewnas.vrc-embodied-companion/Runtime')
          lifecycle = (runtime / 'CompanionPlayerLifecycle.cs').read_text(encoding='utf-8')
          lookup = (runtime / 'CompanionPlayerLookup.cs').read_text(encoding='utf-8')
          bootstrap = Path('World/Assets/Editor/CompanionMinimalWorldBootstrap.cs').read_text(encoding='utf-8')

          lifecycle_required = [
              'StateSpawned',
              'StateRestoring',
              'StateReady',
              'StateDisabled',
              'StateDetached',
              'public override void OnPlayerRestored(VRCPlayerApi player)',
              'restore_ignored_detached',
              'owner.playerId != player.playerId',
              'restore_ignored_owner_mismatch',
              'public override void OnPlayerLeft(VRCPlayerApi player)',
              'MarkDetached("owner_left")',
              'RefreshOwner("player_left")',
              'CanMutateLocalState()',
              'IsLocalOwnerNow()',
              'owner_changed_unexpectedly',
              'MarkDetached(reason + "_owner_invalid")',
              '_owner_unavailable_initially',
              'preserveDisabled',
              '_owner_valid_disabled',
          ]
          for token in lifecycle_required:
              assert token in lifecycle, token

          lifecycle_forbidden = [
              'Networking.SetOwner',
              '[UdonSynced]',
              'RequestSerialization()',
          ]
          for token in lifecycle_forbidden:
              assert token not in lifecycle, token

          # Leave cleanup must not depend on the callback VRCPlayerApi still being valid. VRChat
          # documents that cached player references become invalid after leave, so the fallback path
          # must re-check the PlayerObject's actual owner instead of returning early.
          on_left = lifecycle.split('public override void OnPlayerLeft(VRCPlayerApi player)', 1)[1]
          on_left = on_left.split('public bool IsReady()', 1)[0]
          assert 'RefreshOwner("player_left")' in on_left
          assert 'if (!Utilities.IsValid(player))' not in on_left

          # Detached is terminal. A stale associatedPlayerId may remain for diagnostics, but it must
          # never make MatchesPlayer return true and leak a detached PlayerObject through lookup.
          matches_player = lifecycle.split('public bool MatchesPlayer(VRCPlayerApi player)', 1)[1]
          matches_player = matches_player.split('public VRCPlayerApi GetAssociatedPlayer()', 1)[0]
          assert 'if (lifecycleState == StateDetached)' in matches_player

          lookup_required = [
              'Networking.GetPlayerObjects(player)',
              'GetComponentInChildren<CompanionPlayerLifecycle>()',
              'lifecycle.RefreshLifecycleOwner()',
              'lifecycle.MatchesPlayer(player)',
              'return null;',
          ]
          for token in lookup_required:
              assert token in lookup, token

          lookup_forbidden = [
              'Networking.SetOwner',
              'FindObjectOfType',
              'FindFirstObjectByType',
          ]
          for token in lookup_forbidden:
              assert token not in lookup, token

          # The minimal World must now serialize a real PlayerObject template with its lifecycle
          # behaviour on the PlayerObject root. That keeps Networking.GetOwner(gameObject) anchored
          # to the object whose ownership VRChat assigns per player instead of an unsynced child.
          # UdonSharp editor-created behaviours must use AddUdonSharpComponent so backing
          # UdonBehaviour/program setup is performed; plain AddComponent is not sufficient.
          bootstrap_required = [
              'using UdonSharpEditor;',
              'using UyNewNas.VRCEmbodiedCompanion;',
              'new GameObject("CompanionPlayerObjectTemplate")',
              'AddComponent<VRCPlayerObject>()',
              'playerObjectTemplate.AddUdonSharpComponent<CompanionPlayerLifecycle>()',
              'GetComponent<VRCPlayerObject>()',
              'playerObjectTemplate.GetComponent<CompanionPlayerLifecycle>()',
              'new GameObject("CompanionRuntime")',
              'AddUdonSharpComponent<CompanionPlayerLookup>()',
              'GetComponent<CompanionPlayerLookup>()',
          ]
          for token in bootstrap_required:
              assert token in bootstrap, token

          bootstrap_forbidden = [
              'AddComponent<CompanionPlayerLifecycle>()',
              'AddComponent<CompanionPlayerLookup>()',
              'new GameObject("Lifecycle")',
          ]
          for token in bootstrap_forbidden:
              assert token not in bootstrap, token

          # Lookup/refresh must not silently re-enable a disabled companion or resurrect a detached one.
          assert 'if (preserveDisabled)' in lifecycle
          assert 'lifecycleState = StateDisabled;' in lifecycle
          assert lifecycle.count('if (lifecycleState == StateDetached)') >= 4

          print('Player lifecycle source contract OK')
          PY
