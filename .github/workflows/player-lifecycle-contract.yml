name: Player lifecycle contract

on:
  pull_request:
    paths:
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/CompanionPlayerLifecycle.cs'
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/CompanionPlayerLookup.cs'
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/README.md'
      - 'World/Assets/Editor/CompanionMinimalWorldBootstrap.cs'
      - '.github/workflows/player-lifecycle-contract.yml'
  push:
    branches:
      - master
    paths:
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/CompanionPlayerLifecycle.cs'
      - 'Packages/com.uynewnas.vrc-embodied-companion/Runtime/CompanionPlayerLookup.cs'
      - 'World/Assets/Editor/CompanionMinimalWorldBootstrap.cs'
      - '.github/workflows/player-lifecycle-contract.yml'

jobs:
  validate-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate PlayerObject lifecycle invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('Packages/com.uynewnas.vrc-embodied-companion/Runtime')
          lifecycle = (runtime / 'CompanionPlayerLifecycle.cs').read_text(encoding='utf-8')
          lookup = (runtime / 'CompanionPlayerLookup.cs').read_text(encoding='utf-8')
          bootstrap = Path('World/Assets/Editor/CompanionMinimalWorldBootstrap.cs').read_text(encoding='utf-8')

          lifecycle_required = [
              'StateSpawned',
              'StateRestoring',
              'StateReady',
              'StateDisabled',
              'StateDetached',
              'public override void OnPlayerRestored(VRCPlayerApi player)',
              'restore_ignored_detached',
              'owner.playerId != player.playerId',
              'restore_ignored_owner_mismatch',
              'public override void OnPlayerLeft(VRCPlayerApi player)',
              'MarkDetached("owner_left")',
              'CanMutateLocalState()',
              'IsLocalOwnerNow()',
              'owner_changed_unexpectedly',
              'MarkDetached(reason + "_owner_invalid")',
              '_owner_unavailable_initially',
              'preserveDisabled',
              '_owner_valid_disabled',
          ]
          for token in lifecycle_required:
              assert token in lifecycle, token

          lifecycle_forbidden = [
              'Networking.SetOwner',
              '[UdonSynced]',
              'RequestSerialization()',
          ]
          for token in lifecycle_forbidden:
              assert token not in lifecycle, token

          lookup_required = [
              'Networking.GetPlayerObjects(player)',
              'GetComponentInChildren<CompanionPlayerLifecycle>()',
              'lifecycle.RefreshLifecycleOwner()',
              'lifecycle.MatchesPlayer(player)',
              'return null;',
          ]
          for token in lookup_required:
              assert token in lookup, token

          lookup_forbidden = [
              'Networking.SetOwner',
              'FindObjectOfType',
              'FindFirstObjectByType',
          ]
          for token in lookup_forbidden:
              assert token not in lookup, token

          # The minimal World must now serialize a real PlayerObject template and lifecycle child,
          # instead of leaving #4 as package-only code that is never attached to a scene.
          bootstrap_required = [
              'using UyNewNas.VRCEmbodiedCompanion;',
              'new GameObject("CompanionPlayerObjectTemplate")',
              'AddComponent<VRCPlayerObject>()',
              'AddComponent<CompanionPlayerLifecycle>()',
              'GetComponent<VRCPlayerObject>()',
              'GetComponentInChildren<CompanionPlayerLifecycle>(true)',
              'new GameObject("CompanionRuntime")',
              'AddComponent<CompanionPlayerLookup>()',
              'GetComponent<CompanionPlayerLookup>()',
          ]
          for token in bootstrap_required:
              assert token in bootstrap, token

          # Lookup/refresh must not silently re-enable a disabled companion or resurrect a detached one.
          assert 'if (preserveDisabled)' in lifecycle
          assert 'lifecycleState = StateDisabled;' in lifecycle
          assert lifecycle.count('if (lifecycleState == StateDetached)') >= 3

          print('Player lifecycle source contract OK')
          PY
